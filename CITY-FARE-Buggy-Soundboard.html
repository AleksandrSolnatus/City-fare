<main>
 <header>
  <p class="identity">City Fare</p>
  <h1>Buggy Soundboard</h1>
  <p>Compare three mechanical mixes on the same short drive over rock, gravel and sand.</p>
 </header>
 <section id="profiles" aria-label="Buggy sound proposals"></section>
 <section class="events" aria-labelledby="events-title">
  <h2 id="events-title">Driving sounds</h2>
  <p>Listen to individual sounds using <strong id="selected-profile">Engine Forward</strong>.</p>
  <div class="cues" id="cues"></div>
 </section>
 <div class="transport">
  <button id="stop" type="button" disabled>Stop playback</button>
  <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="72"></label>
 </div>
 <p id="status" role="status">Ready to audition.</p>

// The same scripted drive is used for every profile so differences are audible.

(function(root){'use strict';
