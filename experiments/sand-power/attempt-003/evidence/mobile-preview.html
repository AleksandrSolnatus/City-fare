<!doctype html><meta charset="utf-8"><title>003 responsive verification</title><style>body{background:#091e25;color:#e8dac0;font:16px system-ui}main{display:flex;gap:25px}iframe{border:1px solid #85785d;border-radius:15px}button{padding:12px}pre{font-size:12px}</style><h1>003 responsive verification</h1><button id="read">Read game diagnostics</button><pre id="result"></pre><main><section><p>390 × 740 portrait</p><iframe id="portrait" width="390" height="740" src="../City-Fare-Sand-Power-003.html"></iframe></section><section><p>844 × 390 landscape</p><iframe id="landscape" width="844" height="390" src="../City-Fare-Sand-Power-003.html"></iframe></section></main><script>document.querySelector('#read').onclick=()=>{let report={};for(const id of ['portrait','landscape']){let w=document.getElementById(id).contentWindow,d=w.document;let i=w.SandPower.inspect();report[id]={viewport:[w.innerWidth,w.innerHeight],pageWidth:d.documentElement.scrollWidth,fatal:i.fatal,tick:i.tick,running:i.running,meanRenderMs:i.meanRenderMs,faces:i.view.drawFaces,inputs:i.inputs}}document.querySelector('#result').textContent=JSON.stringify(report,null,2)}</script>
