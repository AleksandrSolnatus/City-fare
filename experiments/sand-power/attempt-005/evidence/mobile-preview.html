<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>005 responsive verification</title><style>body{background:#14292f;color:#f7e6c8;font:14px system-ui;padding:16px}main{display:flex;gap:24px;align-items:start}iframe{display:block;border:1px solid #ae9270}pre{white-space:pre-wrap;max-width:800px}button{padding:10px}</style><h1>005 responsive verification</h1><button id="read">Read game diagnostics</button><pre id="portrait-state"></pre><pre id="landscape-state"></pre><main><section><p>390 × 740 portrait</p><iframe title="Portrait Dune Ripper" id="portrait" width="390" height="740" src="../City-Fare-Sand-Power-005.html"></iframe></section><section><p>844 × 390 landscape</p><iframe title="Landscape Dune Ripper" id="landscape" width="844" height="390" src="../City-Fare-Sand-Power-005.html"></iframe></section></main><script>read.onclick=()=>{for(const id of ['portrait','landscape']){const w=document.getElementById(id).contentWindow,s=w.SandPower.inspect();document.getElementById(id+'-state').textContent=id+': '+JSON.stringify({viewport:[w.innerWidth,w.innerHeight],width:w.document.documentElement.scrollWidth,fatal:s.fatal,tick:s.tick,running:s.running,kmh:Math.round(s.speed*60),meanRenderMs:Math.round(s.meanRenderMs*100)/100,headPitch:s.view.headPitchRad,caught:s.hunt.count,com:s.com,inputs:s.inputs})}};</script>
